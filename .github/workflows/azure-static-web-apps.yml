name: Build and deploy

on:
  # Every branch is built and verified; only main and development deploy (see
  # the deploy jobs' conditions below).
  push:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

# Nothing by default: each job names the least it needs. No job here writes to
# the repository or comments on pull requests - deploys authenticate to Azure
# with their own token (the clock deploys ask for an OIDC one: id-token: write)
# - so none is granted a write scope.
#
# Third-party actions are pinned to a full commit SHA, with the release it was
# at in the trailing comment: a tag can be moved to other code after review,
# a commit cannot. Bump them deliberately (e.g. Dependabot), SHA and comment
# together.
permissions: {}

jobs:
  build:
    name: Build and verify
    permissions:
      contents: read
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Matches the apiRuntime pinned in staticwebapp.config.json.
          node-version: '24'

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Build API
        working-directory: api
        run: npm run build

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      # What ships to Azure and to browsers, held to no known high or critical
      # vulnerability. Development tools are left out: they never run there.
      - name: Audit shipped dependencies
        run: |
          npm --prefix api audit --omit=dev --audit-level=high
          npm --prefix app audit --omit=dev --audit-level=high

      - name: Build app
        working-directory: app
        run: npm run build

      # "npm test" rather than the scripts by name, so a suite added to it is
      # covered here too. Naming them individually is how the route-conflict
      # guard came to exist without ever running in CI.
      - name: Verify routes, auth seam and HTTP contract
        run: npm test

      # Static Web Apps deploys the api folder as-is, so it must carry its
      # production dependencies and none of its build-time ones.
      - name: Prune API dev dependencies
        working-directory: api
        run: npm prune --omit=dev

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: figmark-build
          path: |
            app/dist
            api
          retention-days: 5

  deploy:
    name: Deploy to Static Web Apps
    permissions:
      contents: read
    needs: build
    # main is the production branch: only it and manual runs deploy here. Other
    # branches are built and verified above but never published by this job.
    # Compared against github.ref rather than ref_name so a tag named "main"
    # cannot trigger a production deploy.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://icy-stone-0498a9900.6.azurestaticapps.net
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: figmark-build

      - name: Deploy
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # Deliberately no skip_deploy_on_missing_secrets: the token now exists,
          # and skipping on a missing secret would turn a failed deployment into
          # a green run that published nothing.
          # Pre-built above, so Oryx must not try to build either side again.
          app_location: app/dist
          api_location: api
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          # Not declared in the action's published action.yml (GitHub Actions
          # warns "Unexpected input"), but its container entrypoint reads this
          # env var regardless and it is load-bearing: without it, a deploy
          # from a non-main branch has been observed landing on the
          # production URL instead of a branch preview. Do not remove this
          # again without re-verifying a non-main deploy lands on its own
          # preview URL.
          production_branch: main

  deploy_development:
    name: Deploy to Static Web Apps (development)
    permissions:
      contents: read
    needs: build
    # development is a permanent, stable non-production environment: every
    # push to it deploys here, separately from the production job above.
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    environment:
      name: development
      url: ${{ steps.deploy.outputs.static_web_app_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: figmark-build

      - name: Deploy
        id: deploy
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: app/dist
          api_location: api
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          # main stays production; deploying from "development" (not main)
          # makes Azure publish this to its own stable branch environment
          # instead of the production slot. This input is load-bearing here:
          # see the comment on the production deploy step above.
          production_branch: main

  # The timers. Static Web Apps' managed functions run HTTP triggers only, so
  # the same API build also goes to a plain Function App started from
  # clock-host.js: the clocks and no routes (see docs/AZURE.md, "The clock
  # Function App"). Each job runs only once its app is named in a repository
  # variable - an opt-in, set when the app exists, rather than a skip on a
  # missing secret: with the variable set, missing credentials fail the run.
  deploy_clocks:
    name: Deploy clocks (production)
    permissions:
      contents: read
      id-token: write # Azure login over OIDC; no stored password
    needs: build
    # Same branches as the Static Web Apps deploy above.
    if: >-
      vars.CLOCK_APP_PRODUCTION != '' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: figmark-build

      - name: Start from the clock entry point
        working-directory: api
        run: |
          test -f dist/api/src/clock-host.js
          npm pkg set main=dist/api/src/clock-host.js

      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        uses: Azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656 # v1.5.7
        with:
          app-name: ${{ vars.CLOCK_APP_PRODUCTION }}
          package: api

  deploy_clocks_development:
    name: Deploy clocks (development)
    permissions:
      contents: read
      id-token: write # Azure login over OIDC; no stored password
    needs: build
    if: >-
      vars.CLOCK_APP_DEVELOPMENT != '' &&
      github.event_name == 'push' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    environment:
      name: development
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: figmark-build

      - name: Start from the clock entry point
        working-directory: api
        run: |
          test -f dist/api/src/clock-host.js
          npm pkg set main=dist/api/src/clock-host.js

      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        uses: Azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656 # v1.5.7
        with:
          app-name: ${{ vars.CLOCK_APP_DEVELOPMENT }}
          package: api

  close_preview:
    name: Close pull request preview
    # Talks to Azure only; it needs no access to the repository at all.
    permissions: {}
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Close
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
