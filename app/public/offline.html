<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#5B5EF1" />
    <title>Offline - Figmark</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #080B12; color: #F2F5FA;
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: 24px; box-sizing: border-box; text-align: center;
      }
      main { max-width: 340px; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 22px; margin: 18px 0 6px; }
      p { color: #A3ADC2; margin: 0 0 22px; }
      a {
        display: inline-block; padding: 12px 22px; border-radius: 999px;
        background: linear-gradient(115deg, #3B82F6, #7C3AED); color: #fff;
        font-weight: 600; text-decoration: none;
      }
      a:focus-visible { outline: 2px solid #A5B4FC; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Figmark needs a connection to show what's for sale right now. Nothing you were doing has been lost.</p>
      <a href="">Try again</a>
    </main>
  </body>
</html>
