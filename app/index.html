<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- iPhone and iPad only: stop the zoom into small fields. -->
    <script src="/boot/viewport.js"></script>
    <meta name="theme-color" content="#5B5EF1" />
    <!-- The section's colour before the first paint. -->
    <script src="/boot/tone.js"></script>
    <title>Figmark</title>
    <!-- Installable: on a phone's home screen it opens like an app, and on an
         iPhone that is what lets it show notifications at all. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Figmark" />
    <!-- "default", not "black-translucent". Translucent drew the page under
         the clock, and from iOS 26 the home-screen app lays its Liquid Glass
         edge blur over whatever is there and a band below it - the header's
         logo and icons included. "default" puts the page below an opaque
         status bar, which iOS tints from theme-color: each section's colour,
         set before the first paint above and on every change of section in
         AppShell. iOS keeps these tags from when the icon was added, so an
         existing home-screen icon has to be removed and added again. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="Marketplace for import resellers: pre-orders, order manifests, Buyer Protection and verified two-sided reviews."
    />
    <!-- What a link to anywhere on the site unfolds into in WhatsApp and the
         rest. Shared items, shops and invites get their own: /api/og writes
         them over these (see api/src/functions/og-routes.ts). -->
    <meta property="og:site_name" content="Figmark" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Figmark - import pre-orders, Buyer Protection and real reviews" />
    <meta property="og:description" content="Join pre-orders from import resellers, track every stage, and pay with Buyer Protection. Collect cards and level up as you shop." />
    <meta property="og:image" content="/og/figmark.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
